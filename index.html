<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>複数年日記</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ上でReactコードを翻訳するツール) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- X(Twitter)公式埋め込みウィジェット -->
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    
    /* アニメーション用 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    /* スマホのスワイプ風エフェクト */
    @keyframes slideInFromRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
    .animate-slide-left { animation: slideInFromRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .animate-slide-right { animation: slideInFromLeft 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    
    /* スクロールバー非表示（横スクロール用） */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div id="root"></div>

  <!-- ここからReactのコード -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // ★ ここにGASで取得した「ウェブアプリのURL」を貼り付けます ★
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7l8C5gSJmO3EvrSey5wt7R3UyHgxcFwUenoCkd5hy9pFdtx3EN4VVy25_S-staX49/exec"; 

    // 気分と天気の選択肢
    const MOODS = ['😆', '😊', '😐', '😔', '😫'];
    const WEATHERS = ['☀️', '☁️', '☔️', '⛄️'];

    const splitTags = (str) => {
      if (!str) return [];
      return str.split(/[,、]+/).map(s => s.trim()).filter(Boolean);
    };

    const addDays = (dateStr, days) => {
      const date = new Date(dateStr);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    // テキストからX(Twitter)のURLを抽出する
    const extractTweetUrls = (text) => {
      if (!text) return [];
      // x.com と twitter.com の両方に対応
      const regex = /https?:\/\/(?:twitter\.com|x\.com)\/[a-zA-Z0-9_]+\/status\/[0-9]+/g;
      return Array.from(new Set(text.match(regex) || []));
    };

    // X(Twitter)の埋め込みプレビューコンポーネント
    function TweetEmbed({ url }) {
      const containerRef = useRef(null);

      useEffect(() => {
        const loadTwitterWidget = () => {
          if (window.twttr && containerRef.current) {
            window.twttr.widgets.load(containerRef.current);
          }
        };

        if (!window.twttr) {
          const script = document.createElement('script');
          script.src = "https://platform.twitter.com/widgets.js";
          script.async = true;
          script.onload = loadTwitterWidget;
          document.body.appendChild(script);
        } else {
          loadTwitterWidget();
        }
      }, [url]);

      // X.com だと埋め込みウィジェットが反応しない事があるため、twitter.comに置換する
      const embedUrl = url.replace('x.com', 'twitter.com');

      return (
        <div ref={containerRef} className="w-full flex justify-center my-3 min-h-[100px] bg-gray-50 rounded-xl items-center text-gray-400 text-xs overflow-hidden">
          <blockquote className="twitter-tweet" data-dnt="true" data-theme="light">
            <a href={embedUrl}>Loading Tweet...</a>
          </blockquote>
        </div>
      );
    }

    // 画像圧縮処理
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600; 
            const MAX_HEIGHT = 600;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [entries, setEntries] = useState([]);
      const [isLoading, setIsLoading] = useState(false);

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      const [viewingDateStr, setViewingDateStr] = useState(todayStr);

      useEffect(() => {
        const fetchEntries = async () => {
          if (GAS_WEB_APP_URL) {
            setIsLoading(true);
            try {
              const response = await fetch(GAS_WEB_APP_URL);
              const data = await response.json();
              const sortedData = data.sort((a, b) => new Date(b.when) - new Date(a.when));
              setEntries(sortedData);
            } catch (error) {
              console.error("データの取得に失敗しました:", error);
            } finally {
              setIsLoading(false);
            }
          } else {
            const saved = localStorage.getItem('multiYearDiaryEntries');
            if (saved) {
              setEntries(JSON.parse(saved));
            }
          }
        };

        fetchEntries();
      }, []);

      const saveEntry = async (entry) => {
        setEntries(prevEntries => {
          let newEntries = [...prevEntries];
          const existingIndex = newEntries.findIndex(e => e.when === entry.when);
          
          if (existingIndex >= 0) {
            newEntries[existingIndex] = { ...newEntries[existingIndex], ...entry };
          } else {
            newEntries.unshift({ ...entry, id: Date.now().toString() });
          }

          if (!GAS_WEB_APP_URL) {
            localStorage.setItem('multiYearDiaryEntries', JSON.stringify(newEntries));
          }
          return newEntries;
        });

        if (GAS_WEB_APP_URL) {
          try {
            await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              body: JSON.stringify(entry), 
            });
          } catch (error) {
            console.error("保存に失敗しました:", error);
          }
        }
      };

      return (
        <div className="min-h-screen bg-white flex flex-col relative">
          {isLoading && (
            <div className="absolute inset-0 bg-white/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
              <i className="fas fa-spinner fa-spin text-blue-600 mb-2 text-3xl"></i>
              <p className="text-sm font-medium text-gray-600">同期中...</p>
            </div>
          )}

          {/* 横揺れ防止のため overflow-x-hidden を追加 */}
          <main className="flex-1 overflow-y-auto overflow-x-hidden pb-20">
            {activeTab === 'home' && (
              <HomeTab 
                viewingDateStr={viewingDateStr} 
                setViewingDateStr={setViewingDateStr}
                todayStr={todayStr} 
                entries={entries} 
                onSave={saveEntry} 
                isGasLinked={!!GAS_WEB_APP_URL} 
              />
            )}
            {activeTab === 'calendar' && (
              <CalendarTab 
                entries={entries} 
                todayStr={todayStr} 
                onSelectDate={(date) => {
                  setViewingDateStr(date);
                  setActiveTab('home');
                }}
              />
            )}
            {activeTab === 'search' && <SearchTab entries={entries} />}
            {activeTab === 'insights' && <InsightsTab entries={entries} />}
          </main>

          <nav className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 pb-safe z-40">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <i className="fas fa-pen-to-square text-xl"></i>
              <span className="text-[10px] font-medium">入力</span>
            </button>
            <button onClick={() => setActiveTab('calendar')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'calendar' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <i className="fas fa-calendar text-xl"></i>
              <span className="text-[10px] font-medium">カレンダー</span>
            </button>
            <button onClick={() => setActiveTab('search')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'search' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <i className="fas fa-search text-xl"></i>
              <span className="text-[10px] font-medium">検索</span>
            </button>
            <button onClick={() => setActiveTab('insights')} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'insights' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
              <i className="fas fa-chart-pie text-xl"></i>
              <span className="text-[10px] font-medium">振り返り</span>
            </button>
          </nav>
        </div>
      );
    }

    // ==========================================
    // 入力タブ
    // ==========================================
    function HomeTab({ viewingDateStr, setViewingDateStr, todayStr, entries, onSave, isGasLinked }) {
      const [what, setWhat] = useState('');
      const [where, setWhere] = useState('');
      const [withWhom, setWithWhom] = useState('');
      const [mood, setMood] = useState('');
      const [weather, setWeather] = useState('');
      const [images, setImages] = useState([]);
      
      const [saveMessage, setSaveMessage] = useState('');
      const [isSaving, setIsSaving] = useState(false);

      const [slideEffect, setSlideEffect] = useState('animate-fade-in');

      // --- 自動保存用の処理 ---
      const stateRef = useRef({ what, where, withWhom, mood, weather, images, viewingDateStr, entries });
      const onSaveRef = useRef(onSave);
      
      // 常に最新の入力状態を保持しておく
      useEffect(() => {
        stateRef.current = { what, where, withWhom, mood, weather, images, viewingDateStr, entries };
        onSaveRef.current = onSave;
      });

      // 日付が変わる直前、またはタブが切り替わる直前に変更があれば自動保存
      useEffect(() => {
        return () => {
          const state = stateRef.current;
          const originalEntry = state.entries.find(e => e.when === state.viewingDateStr) || {};
          
          const isChanged = 
            (originalEntry.what || '') !== state.what ||
            (originalEntry.where || '') !== state.where ||
            (originalEntry.withWhom || '') !== state.withWhom ||
            (originalEntry.mood || '') !== state.mood ||
            (originalEntry.weather || '') !== state.weather ||
            JSON.stringify(originalEntry.images || []) !== JSON.stringify(state.images);

          const hasContent = state.what || state.where || state.withWhom || state.mood || state.weather || state.images.length > 0;

          if (isChanged && hasContent) {
            onSaveRef.current({ 
              when: state.viewingDateStr, 
              what: state.what, 
              where: state.where, 
              withWhom: state.withWhom, 
              mood: state.mood, 
              weather: state.weather, 
              images: state.images 
            });
          }
        };
      }, [viewingDateStr]); 
      // -------------------------

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);
      const touchTime = useRef(null);
      const minSwipeDistance = 50; 
      const maxSwipeTime = 300; 

      const handleNextDay = () => {
        setSlideEffect('animate-slide-left');
        setViewingDateStr(addDays(viewingDateStr, 1));
      };

      const handlePrevDay = () => {
        setSlideEffect('animate-slide-right');
        setViewingDateStr(addDays(viewingDateStr, -1));
      };

      const handleToday = () => {
        const tDate = new Date(todayStr);
        const vDate = new Date(viewingDateStr);
        setSlideEffect(tDate > vDate ? 'animate-slide-left' : 'animate-slide-right');
        setViewingDateStr(todayStr);
      };

      const handleTouchStart = (e) => {
        if (['TEXTAREA', 'INPUT', 'BUTTON', 'LABEL', 'A'].includes(e.target.tagName)) return;
        
        touchStartX.current = e.targetTouches[0].clientX;
        touchStartY.current = e.targetTouches[0].clientY;
        touchTime.current = Date.now();
      };

      const handleTouchEnd = (e) => {
        if (!touchStartX.current || !touchStartY.current) return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        
        const distanceX = touchStartX.current - touchEndX;
        const distanceY = touchStartY.current - touchEndY;
        const timeElapsed = Date.now() - touchTime.current;
        
        touchStartX.current = null;
        touchStartY.current = null;

        if (timeElapsed > maxSwipeTime) return;
        if (Math.abs(distanceY) > Math.abs(distanceX)) return;

        const isLeftSwipe = distanceX > minSwipeDistance;
        const isRightSwipe = distanceX < -minSwipeDistance;

        if (isLeftSwipe) {
          handleNextDay();
        } else if (isRightSwipe) {
          handlePrevDay();
        }
      };

      const popularPlaces = useMemo(() => {
        const map = {};
        entries.forEach(e => splitTags(e.where).forEach(p => map[p] = (map[p] || 0) + 1));
        return Object.entries(map).sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 5); 
      }, [entries]);

      const popularPeople = useMemo(() => {
        const map = {};
        entries.forEach(e => splitTags(e.withWhom).forEach(p => map[p] = (map[p] || 0) + 1));
        return Object.entries(map).sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 5); 
      }, [entries]);

      useEffect(() => {
        const entry = entries.find(e => e.when === viewingDateStr);
        if (entry) {
          setWhat(entry.what || '');
          setWhere(entry.where || '');
          setWithWhom(entry.withWhom || '');
          setMood(entry.mood || '');
          setWeather(entry.weather || '');
          setImages(entry.images || []);
        } else {
          setWhat(''); setWhere(''); setWithWhom(''); setMood(''); setWeather(''); setImages([]);
        }
      }, [viewingDateStr, entries]);

      const pastEntries = useMemo(() => {
        const viewDate = new Date(viewingDateStr);
        const month = viewDate.getMonth();
        const date = viewDate.getDate();
        const currentYear = viewDate.getFullYear();

        return entries.filter(e => {
          if(!e.when) return false;
          const d = new Date(e.when);
          return d.getMonth() === month && d.getDate() === date && d.getFullYear() !== currentYear;
        }).sort((a, b) => new Date(b.when) - new Date(a.when));
      }, [entries, viewingDateStr]);

      const handleSave = async () => {
        setIsSaving(true);
        await onSave({ when: viewingDateStr, what, where, withWhom, mood, weather, images });
        setIsSaving(false);
        setSaveMessage('保存しました');
        setTimeout(() => setSaveMessage(''), 3000);
      };

      const handleImageChange = async (e) => {
        const files = Array.from(e.target.files);
        const remainingSlots = 3 - images.length;
        const filesToProcess = files.slice(0, remainingSlots);
        
        setIsSaving(true);
        const processedImages = await Promise.all(filesToProcess.map(compressImage));
        setImages([...images, ...processedImages]);
        setIsSaving(false);
      };

      const handleRemoveImage = (index) => {
        setImages(images.filter((_, i) => i !== index));
      };

      const handleAddTag = (setter, currentVal, tag) => {
        const tags = splitTags(currentVal);
        if (!tags.includes(tag)) {
          setter(tags.length > 0 ? `${currentVal}, ${tag}` : tag);
        }
      };

      const [year, month, day] = viewingDateStr.split('-');
      const isToday = viewingDateStr === todayStr;
      
      // 入力中のテキストから抽出したXのURL
      const inputTweetUrls = extractTweetUrls(what);

      return (
        <div 
          className="p-4 max-w-lg mx-auto"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          <div key={viewingDateStr} className={`${slideEffect} flex flex-col gap-4 pb-4`}>
            
            {!isGasLinked && (
              <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 text-[10px] sm:text-xs p-2 rounded-lg leading-tight">
                オフラインモードです。コード内の <code>GAS_WEB_APP_URL</code> を設定するとスプレッドシートと連携します。
              </div>
            )}

            <div className="flex items-center justify-between mt-2 bg-gray-50 rounded-2xl p-2 border border-gray-100">
              <button onClick={handlePrevDay} className="p-2 w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-200 rounded-xl transition-colors">
                <i className="fas fa-chevron-left"></i>
              </button>
              <div className="text-center flex flex-col items-center">
                <div className="flex items-center gap-2">
                  <h1 className="text-xl sm:text-2xl font-bold text-gray-800">{year}年{parseInt(month)}月{parseInt(day)}日</h1>
                </div>
                {!isToday ? (
                  <button onClick={handleToday} className="text-xs text-blue-600 font-medium flex items-center mt-1 bg-blue-50 px-2 py-0.5 rounded-full">
                    <i className="fas fa-calendar-day mr-1"></i> 今日へ戻る
                  </button>
                ) : <span className="text-xs text-gray-400 font-medium mt-1">今日</span>}
              </div>
              <button onClick={handleNextDay} className="p-2 w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-200 rounded-xl transition-colors">
                <i className="fas fa-chevron-right"></i>
              </button>
            </div>

            <div className="space-y-5 bg-white p-4 sm:p-5 rounded-3xl shadow-sm border border-gray-100 relative">
              
              <div className="flex justify-between items-center bg-gray-50 p-2 rounded-2xl">
                <div className="flex gap-1">
                  {MOODS.map(m => (
                    <button key={m} onClick={() => setMood(m)} className={`w-8 h-8 text-xl flex items-center justify-center rounded-full transition-all ${mood === m ? 'bg-white shadow-sm ring-2 ring-blue-400 scale-110' : 'opacity-60 hover:opacity-100 hover:bg-gray-200'}`}>{m}</button>
                  ))}
                </div>
                <div className="w-px h-6 bg-gray-300 mx-2"></div>
                <div className="flex gap-1">
                  {WEATHERS.map(w => (
                    <button key={w} onClick={() => setWeather(w)} className={`w-8 h-8 text-xl flex items-center justify-center rounded-full transition-all ${weather === w ? 'bg-white shadow-sm ring-2 ring-orange-400 scale-110' : 'opacity-60 hover:opacity-100 hover:bg-gray-200'}`}>{w}</button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center justify-between">
                  <span>できごと</span>
                  {inputTweetUrls.length > 0 && <span className="text-[10px] text-blue-500"><i className="fab fa-twitter"></i> Xのリンクを検知</span>}
                </label>
                <textarea value={what} onChange={(e) => setWhat(e.target.value)} className="w-full p-3 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none text-base" rows="4" placeholder="X(旧Twitter)のURLを貼ると、自動でツイートが表示されます！" disabled={isSaving}/>
                
                {/* ツイートプレビュー (入力中) */}
                {inputTweetUrls.length > 0 && (
                  <div className="flex flex-col gap-2 mt-2">
                    {inputTweetUrls.map((url, i) => <TweetEmbed key={`input-${url}-${i}`} url={url} />)}
                  </div>
                )}
              </div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center"><i className="fas fa-map-marker-alt mr-1"></i> 場所</label>
                  <input type="text" value={where} onChange={(e) => setWhere(e.target.value)} className="w-full p-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="例: 自宅, 渋谷" disabled={isSaving} />
                  {popularPlaces.length > 0 && (
                    <div className="flex flex-wrap gap-1 mt-2">
                      {popularPlaces.map((p, i) => (
                        <button key={i} onClick={() => handleAddTag(setWhere, where, p)} className="text-[10px] bg-green-50 text-green-700 px-2 py-1 rounded-md border border-green-100 hover:bg-green-100 whitespace-nowrap active:scale-95 transition-transform">+{p}</button>
                      ))}
                    </div>
                  )}
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center"><i className="fas fa-users mr-1"></i> 誰と</label>
                  <input type="text" value={withWhom} onChange={(e) => setWithWhom(e.target.value)} className="w-full p-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="例: 家族, 山田さん" disabled={isSaving} />
                  {popularPeople.length > 0 && (
                    <div className="flex flex-wrap gap-1 mt-2">
                      {popularPeople.map((p, i) => (
                        <button key={i} onClick={() => handleAddTag(setWithWhom, withWhom, p)} className="text-[10px] bg-orange-50 text-orange-700 px-2 py-1 rounded-md border border-orange-100 hover:bg-orange-100 whitespace-nowrap active:scale-95 transition-transform">+{p}</button>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="mt-4">
                <label className="block text-sm font-medium text-gray-700 mb-2 flex items-center"><i className="fas fa-camera mr-1"></i> 写真 (最大3枚)</label>
                <div className="flex flex-col gap-3">
                  {images.map((img, idx) => (
                    <div key={idx} className="relative w-full aspect-square bg-gray-100 rounded-2xl overflow-hidden border border-gray-200">
                      <img src={img} className="w-full h-full object-cover" />
                      <button onClick={() => handleRemoveImage(idx)} className="absolute top-3 right-3 bg-red-500/90 backdrop-blur-sm text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i className="fas fa-times"></i></button>
                    </div>
                  ))}
                  {images.length < 3 && (
                    <label className={`w-full aspect-square flex flex-col items-center justify-center bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl cursor-pointer hover:bg-gray-100 transition-colors ${isSaving ? 'opacity-50 pointer-events-none' : ''}`}>
                      <i className="fas fa-plus text-gray-400 text-xl mb-1"></i>
                      <span className="text-xs text-gray-500 font-medium">写真をえらぶ</span>
                      <input type="file" accept="image/*" multiple onChange={handleImageChange} className="hidden" disabled={isSaving} />
                    </label>
                  )}
                </div>
              </div>

              <div className="pt-4 flex items-center justify-between border-t border-gray-100 mt-4">
                <span className="text-sm text-green-600 font-medium">{saveMessage}</span>
                <button onClick={handleSave} disabled={isSaving} className={`flex items-center text-white px-6 py-3 rounded-2xl font-bold transition-all shadow-md ${isSaving ? 'bg-blue-400' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'}`}>
                  {isSaving && <i className="fas fa-spinner fa-spin mr-2"></i>}
                  {isSaving ? '保存中...' : '日記を保存する'}
                </button>
              </div>
            </div>

            <div className="mt-6">
              <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <i className="fas fa-clock mr-2 text-gray-500"></i> 過去の同日の日記
              </h2>
              
              {pastEntries.length === 0 ? (
                <div className="text-center py-8 bg-gray-50 rounded-2xl border border-gray-100 border-dashed">
                  <p className="text-gray-500 text-sm">過去の同日の日記はまだありません。</p>
                </div>
              ) : (
                <div className="space-y-6">
                  {pastEntries.map((entry, idx) => {
                    const entryYear = entry.when.split('-')[0];
                    const places = splitTags(entry.where);
                    const people = splitTags(entry.withWhom);
                    const tweetUrls = extractTweetUrls(entry.what);

                    return (
                      <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-center mb-3 pb-2 border-b border-gray-50">
                          <div className="text-lg font-bold text-blue-600">{entryYear}年</div>
                          <div className="flex gap-2 text-xl">
                            {entry.weather && <span>{entry.weather}</span>}
                            {entry.mood && <span>{entry.mood}</span>}
                          </div>
                        </div>
                        
                        {entry.images && entry.images.length > 0 && (
                          <div className="flex flex-col gap-2 mb-4">
                            {entry.images.map((img, i) => (
                              <img key={i} src={img} className="w-full aspect-square object-cover rounded-2xl border border-gray-100" />
                            ))}
                          </div>
                        )}

                        <p className="text-gray-800 whitespace-pre-wrap text-[15px] leading-relaxed mb-4">{entry.what}</p>
                        
                        {/* 過去のエントリのツイート表示 */}
                        {tweetUrls.length > 0 && (
                          <div className="flex flex-col gap-2 mb-4">
                            {tweetUrls.map((url, i) => <TweetEmbed key={`past-${url}-${i}`} url={url} />)}
                          </div>
                        )}

                        {(places.length > 0 || people.length > 0) && (
                          <div className="flex flex-wrap gap-2">
                            {places.map((place, i) => <span key={`p-${i}`} className="inline-flex items-center px-2 py-1 bg-green-50 text-green-700 text-[10px] font-bold rounded-md border border-green-100"><i className="fas fa-map-marker-alt mr-1"></i> {place}</span>)}
                            {people.map((person, i) => <span key={`w-${i}`} className="inline-flex items-center px-2 py-1 bg-orange-50 text-orange-700 text-[10px] font-bold rounded-md border border-orange-100"><i className="fas fa-users mr-1"></i> {person}</span>)}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // カレンダータブ
    // ==========================================
    function CalendarTab({ entries, todayStr, onSelectDate }) {
      const [currentYear, setCurrentYear] = useState(new Date(todayStr).getFullYear());
      const [selectedDate, setSelectedDate] = useState(null);
      const months = Array.from({ length: 12 }, (_, i) => i);

      const entryDatesMap = useMemo(() => {
        const map = {};
        entries.forEach(e => { if(e.when && !map[e.when]) map[e.when] = e; });
        return map;
      }, [entries]);

      const selectedEntry = useMemo(() => {
        if (!selectedDate) return null;
        return entries.find(e => e.when === selectedDate) || null;
      }, [selectedDate, entries]);

      const tweetUrls = selectedEntry ? extractTweetUrls(selectedEntry.what) : [];

      return (
        <div className="pb-10 bg-white animate-fade-in">
          <div className="sticky top-0 bg-white/95 backdrop-blur-sm z-10 p-4 border-b border-gray-100 flex justify-between items-center">
            <button onClick={() => setCurrentYear(prev => prev - 1)} className="p-2 w-10 h-10 flex items-center justify-center text-gray-400 hover:bg-gray-50 rounded-full">
              <i className="fas fa-chevron-left"></i>
            </button>
            <h1 className="text-4xl font-bold text-red-500 tracking-tighter">{currentYear}年</h1>
            <button onClick={() => setCurrentYear(prev => prev + 1)} className="p-2 w-10 h-10 flex items-center justify-center text-gray-400 hover:bg-gray-50 rounded-full">
              <i className="fas fa-chevron-right"></i>
            </button>
          </div>

          <div className="grid grid-cols-3 gap-x-2 gap-y-6 p-4 max-w-3xl mx-auto">
            {months.map(month => (
              <MonthCalendar key={month} year={currentYear} month={month} todayStr={todayStr} entryDatesMap={entryDatesMap} onDayClick={setSelectedDate} />
            ))}
          </div>

          {selectedDate && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-xl animate-zoom-in max-h-[90vh] flex flex-col">
                <div className="p-4 border-b flex justify-between items-center bg-gray-50 flex-shrink-0">
                  <h3 className="font-bold text-lg text-gray-800">{selectedDate.split('-')[0]}年{parseInt(selectedDate.split('-')[1])}月{parseInt(selectedDate.split('-')[2])}日</h3>
                  <button onClick={() => setSelectedDate(null)} className="w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-200 rounded-full"><i className="fas fa-times"></i></button>
                </div>
                <div className="p-6 overflow-y-auto">
                  {selectedEntry ? (
                    <>
                      <div className="flex gap-2 text-2xl mb-3">
                        {selectedEntry.weather && <span>{selectedEntry.weather}</span>}
                        {selectedEntry.mood && <span>{selectedEntry.mood}</span>}
                      </div>
                      
                      {selectedEntry.images && selectedEntry.images.length > 0 && (
                        <div className="flex flex-col gap-2 mb-4">
                          {selectedEntry.images.map((img, i) => (
                            <img key={i} src={img} className="w-full aspect-square object-cover rounded-2xl border border-gray-100" />
                          ))}
                        </div>
                      )}

                      <p className="text-gray-800 whitespace-pre-wrap text-[15px] leading-relaxed mb-4">{selectedEntry.what}</p>

                      {tweetUrls.length > 0 && (
                        <div className="flex flex-col gap-2 mb-4">
                          {tweetUrls.map((url, i) => <TweetEmbed key={`modal-${url}-${i}`} url={url} />)}
                        </div>
                      )}

                      <div className="flex flex-wrap gap-2 mb-4">
                        {splitTags(selectedEntry.where).map((place, i) => <span key={`p-${i}`} className="inline-flex items-center px-2 py-1 bg-green-50 text-green-700 text-xs font-bold rounded-md border border-green-100"><i className="fas fa-map-marker-alt mr-1"></i> {place}</span>)}
                        {splitTags(selectedEntry.withWhom).map((person, i) => <span key={`w-${i}`} className="inline-flex items-center px-2 py-1 bg-orange-50 text-orange-700 text-xs font-bold rounded-md border border-orange-100"><i className="fas fa-users mr-1"></i> {person}</span>)}
                      </div>
                    </>
                  ) : <div className="text-center py-6 text-gray-400 text-sm">この日の日記はありません。</div>}
                  <button onClick={() => { onSelectDate(selectedDate); setSelectedDate(null); }} className="w-full mt-4 bg-blue-50 text-blue-600 font-bold py-3 rounded-2xl hover:bg-blue-100 flex justify-center items-center active:scale-95 transition-transform">
                    <i className="fas fa-pen-to-square mr-2"></i> この日を編集する
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function MonthCalendar({ year, month, todayStr, entryDatesMap, onDayClick }) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const days = Array(firstDay).fill(null).concat(Array.from({length: daysInMonth}, (_, i) => i + 1));

      return (
        <div className="flex flex-col">
          <h2 className="text-lg font-bold mb-2 ml-1 text-gray-800">{month + 1}月</h2>
          <div className="grid grid-cols-7 gap-y-1 text-center">
            {['日','月','火','水','木','金','土'].map((d, i) => <div key={d} className={`text-[8px] font-medium mb-1 ${i === 0 ? 'text-red-400' : 'text-gray-400'}`}>{d}</div>)}
            {days.map((day, index) => {
              if (!day) return <div key={`empty-${index}`} />;
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const isToday = dateStr === todayStr;
              const entry = entryDatesMap[dateStr];
              const hasEntry = !!entry;

              return (
                <button key={dateStr} onClick={() => onDayClick(dateStr)} className="relative flex flex-col items-center justify-center w-full aspect-square text-xs font-medium active:scale-90 transition-transform">
                  <span className={`flex items-center justify-center w-6 h-6 rounded-full ${isToday ? 'bg-red-500 text-white font-bold shadow-sm' : 'text-gray-800'}`}>{day}</span>
                  {hasEntry && !isToday && (
                    <div className="absolute -bottom-1 text-[10px] leading-none opacity-80 pointer-events-none">
                      {entry.mood ? entry.mood : <div className="w-1 h-1 bg-gray-400 rounded-full mx-auto mb-1"></div>}
                    </div>
                  )}
                  {hasEntry && isToday && (
                    <div className="absolute -bottom-1 text-[10px] leading-none opacity-100 pointer-events-none">
                      {entry.mood ? entry.mood : <div className="w-1 h-1 bg-white rounded-full mx-auto mb-1"></div>}
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 検索タブ
    // ==========================================
    function SearchTab({ entries }) {
      const [query, setQuery] = useState('');

      const popularPeople = useMemo(() => {
        const map = {};
        entries.forEach(e => splitTags(e.withWhom).forEach(p => map[p] = (map[p] || 0) + 1));
        return Object.entries(map).sort((a, b) => b[1] - a[1]).map(e => e[0]);
      }, [entries]);

      const filteredEntries = useMemo(() => {
        if (!query.trim()) return [];
        const lower = query.toLowerCase();
        return entries.filter(e => 
          (e.what || '').toLowerCase().includes(lower) || 
          (e.where || '').toLowerCase().includes(lower) || 
          (e.withWhom || '').toLowerCase().includes(lower)
        ).sort((a, b) => new Date(b.when) - new Date(a.when));
      }, [query, entries]);

      return (
        <div className="p-4 max-w-lg mx-auto animate-fade-in">
          <div className="sticky top-0 bg-white/95 backdrop-blur-sm z-10 pt-4 pb-4 border-b border-gray-100">
            <h1 className="text-2xl font-bold text-gray-800 mb-4">検索</h1>
            <div className="relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-search text-gray-400"></i></div>
              <input type="text" className="block w-full pl-10 pr-10 py-3 border border-gray-200 rounded-2xl bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="内容、人、場所で検索..." value={query} onChange={(e) => setQuery(e.target.value)} />
              {query && <button onClick={() => setQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>}
            </div>
          </div>

          <div className="mt-4">
            {!query.trim() && popularPeople.length > 0 && (
              <div className="mb-8">
                <h3 className="text-sm font-bold text-gray-500 mb-3 flex items-center"><i className="fas fa-users mr-1"></i> 人で絞り込む</h3>
                <div className="flex flex-wrap gap-2">
                  {popularPeople.map((person, idx) => <button key={idx} onClick={() => setQuery(person)} className="px-3 py-1.5 bg-orange-50 text-orange-700 text-sm font-bold rounded-xl border border-orange-100 active:scale-95">{person}</button>)}
                </div>
              </div>
            )}

            {!query.trim() ? (
              popularPeople.length === 0 && <div className="text-center py-12 text-gray-400"><i className="fas fa-search text-4xl mb-4 opacity-20"></i><p className="text-sm">思い出を検索してみましょう</p></div>
            ) : filteredEntries.length === 0 ? (
              <div className="text-center py-12 text-gray-500">一致する日記は見つかりませんでした。</div>
            ) : (
              <div className="space-y-6">
                <p className="text-sm text-gray-500 mb-2">{filteredEntries.length}件見つかりました</p>
                {filteredEntries.map((entry, idx) => {
                  const tweetUrls = extractTweetUrls(entry.what);

                  return (
                    <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                      <div className="text-sm font-bold text-blue-600 mb-3 flex justify-between border-b border-gray-50 pb-2">
                        {entry.when && entry.when.replace(/-/g, '/')}
                        <span className="text-lg leading-none">{entry.mood} {entry.weather}</span>
                      </div>

                      {entry.images && entry.images.length > 0 && (
                        <div className="flex flex-col gap-2 mb-4">
                          {entry.images.map((img, i) => (
                            <img key={i} src={img} className="w-full aspect-square object-cover rounded-2xl border border-gray-100" />
                          ))}
                        </div>
                      )}

                      <p className="text-gray-800 whitespace-pre-wrap text-[15px] leading-relaxed mb-4">{entry.what}</p>
                      
                      {tweetUrls.length > 0 && (
                        <div className="flex flex-col gap-2 mb-4">
                          {tweetUrls.map((url, i) => <TweetEmbed key={`search-${url}-${i}`} url={url} />)}
                        </div>
                      )}

                      <div className="flex flex-wrap gap-2">
                        {splitTags(entry.where).map((place, i) => <span key={`p-${i}`} className="inline-flex items-center px-2 py-1 bg-green-50 text-green-700 text-[10px] font-bold rounded-md border border-green-100"><i className="fas fa-map-marker-alt mr-1"></i> {place}</span>)}
                        {splitTags(entry.withWhom).map((person, i) => <span key={`w-${i}`} className="inline-flex items-center px-2 py-1 bg-orange-50 text-orange-700 text-[10px] font-bold rounded-md border border-orange-100"><i className="fas fa-users mr-1"></i> {person}</span>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // インサイト（振り返り）タブ
    // ==========================================
    function InsightsTab({ entries }) {
      const totalEntries = entries.filter(e => e.what || e.where || e.withWhom || (e.images && e.images.length > 0)).length;

      const { topPlaces, topPeople, moodCounts } = useMemo(() => {
        const placeMap = {};
        const peopleMap = {};
        const moodMap = {};

        entries.forEach(e => {
          splitTags(e.where).forEach(p => placeMap[p] = (placeMap[p] || 0) + 1);
          splitTags(e.withWhom).forEach(p => peopleMap[p] = (peopleMap[p] || 0) + 1);
          if (e.mood) moodMap[e.mood] = (moodMap[e.mood] || 0) + 1;
        });

        const sortMap = (map) => Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 3); // Top 3

        return {
          topPlaces: sortMap(placeMap),
          topPeople: sortMap(peopleMap),
          moodCounts: Object.entries(moodMap).sort((a, b) => b[1] - a[1])
        };
      }, [entries]);

      return (
        <div className="p-4 max-w-lg mx-auto animate-fade-in bg-gray-50 min-h-screen">
          <div className="pt-4 pb-6">
            <h1 className="text-2xl font-bold text-gray-800 mb-1">振り返り</h1>
            <p className="text-sm text-gray-500">これまでのあなたの記録の集計です。</p>
          </div>

          <div className="space-y-6">
            <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-3xl p-6 text-white shadow-md">
              <h3 className="text-blue-100 font-medium mb-1"><i className="fas fa-book-open mr-2"></i>書いた日数</h3>
              <div className="flex items-baseline">
                <span className="text-5xl font-bold">{totalEntries}</span>
                <span className="ml-2 text-lg opacity-80">日</span>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                <h3 className="text-gray-500 text-xs font-bold mb-3"><i className="fas fa-smile mr-1"></i> 多い気分</h3>
                {moodCounts.length > 0 ? (
                  <div className="flex items-center justify-between">
                    <span className="text-4xl">{moodCounts[0][0]}</span>
                    <span className="text-lg font-bold text-gray-700">{moodCounts[0][1]}回</span>
                  </div>
                ) : <span className="text-gray-400 text-sm">記録なし</span>}
              </div>

              <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                <h3 className="text-gray-500 text-xs font-bold mb-3"><i className="fas fa-crown text-yellow-500 mr-1"></i> ベストパートナー</h3>
                {topPeople.length > 0 ? (
                  <div className="flex flex-col">
                    <span className="text-lg font-bold text-gray-800 truncate">{topPeople[0][0]}</span>
                    <span className="text-sm text-orange-500 font-bold">{topPeople[0][1]}回</span>
                  </div>
                ) : <span className="text-gray-400 text-sm">記録なし</span>}
              </div>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-map-marker-alt text-green-500 mr-2"></i> よく行く場所 TOP 3</h3>
              {topPlaces.length > 0 ? (
                <ul className="space-y-3">
                  {topPlaces.map((item, index) => (
                    <li key={item[0]} className="flex justify-between items-center bg-gray-50 p-3 rounded-2xl">
                      <div className="flex items-center">
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${index === 0 ? 'bg-yellow-100 text-yellow-700' : index === 1 ? 'bg-gray-200 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>
                          {index + 1}
                        </span>
                        <span className="font-bold text-gray-700">{item[0]}</span>
                      </div>
                      <span className="text-gray-500 text-sm font-bold">{item[1]}回</span>
                    </li>
                  ))}
                </ul>
              ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-users text-blue-500 mr-2"></i> よく会う人 TOP 3</h3>
              {topPeople.length > 0 ? (
                <ul className="space-y-3">
                  {topPeople.map((item, index) => (
                    <li key={item[0]} className="flex justify-between items-center bg-gray-50 p-3 rounded-2xl">
                      <div className="flex items-center">
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${index === 0 ? 'bg-yellow-100 text-yellow-700' : index === 1 ? 'bg-gray-200 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>
                          {index + 1}
                        </span>
                        <span className="font-bold text-gray-700">{item[0]}</span>
                      </div>
                      <span className="text-gray-500 text-sm font-bold">{item[1]}回</span>
                    </li>
                  ))}
                </ul>
              ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
