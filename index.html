    function MonthlyInsights({ entries, onOpenProfile, peopleProfiles, randomJumpKey }) {
      const [targetDate, setTargetDate] = useState(new Date());

      const year = targetDate.getFullYear();
      const month = targetDate.getMonth() + 1;
      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

      const monthlyEntries = useMemo(() => entries.filter(e => e.when && e.when.startsWith(monthPrefix)), [entries, monthPrefix]);

      const handlePrevMonth = () => {
        const d = new Date(targetDate);
        d.setMonth(d.getMonth() - 1);
        setTargetDate(d);
      };
      const handleNextMonth = () => {
        const d = new Date(targetDate);
        d.setMonth(d.getMonth() + 1);
        setTargetDate(d);
      };

      // ランダム月ジャンプ処理
      useEffect(() => {
        if (randomJumpKey > 0) {
          const monthsWithEntries = [...new Set(entries.filter(e => e.when).map(e => e.when.substring(0, 7)))];
          if (monthsWithEntries.length > 0) {
            const randomMonthStr = monthsWithEntries[Math.floor(Math.random() * monthsWithEntries.length)];
            const [y, m] = randomMonthStr.split('-');
            setTargetDate(new Date(parseInt(y), parseInt(m) - 1, 1));
          } else {
            const d = new Date();
            d.setMonth(d.getMonth() - Math.floor(Math.random() * 24));
            setTargetDate(d);
          }
        }
      }, [randomJumpKey, entries]);

      const { onTouchStart, onTouchEnd } = useSwipe(handleNextMonth, handlePrevMonth);

      const stats = useMemo(() => {
        const placeMap = {};
        const peopleMap = {};
        const monthImages = [];

        monthlyEntries.forEach(e => {
          splitTags(e.where).forEach(p => placeMap[p] = (placeMap[p] || 0) + 1);
          splitTags(e.withWhom).forEach(p => peopleMap[p] = (peopleMap[p] || 0) + 1);
          if (e.images) monthImages.push(...e.images);
        });

        const sortMap = (map) => Object.entries(map).sort((a, b) => b[1] - a[1]);

        return {
          totalDays: monthlyEntries.length,
          topPlaces: sortMap(placeMap),
          topPeople: sortMap(peopleMap),
          images: monthImages
        };
      }, [monthlyEntries]);

      return (
        <div 
          className="space-y-6 animate-fade-in"
          onTouchStart={(e) => { e.stopPropagation(); onTouchStart(e); }}
          onTouchEnd={(e) => { e.stopPropagation(); onTouchEnd(e); }}
        >
          <div className="flex items-center justify-between bg-white rounded-2xl p-2 shadow-sm border border-gray-100">
            <button onClick={handlePrevMonth} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-xl"><i className="fas fa-chevron-left"></i></button>
            <span className="font-bold text-lg text-gray-800">{year}年 {month}月</span>
            <button onClick={handleNextMonth} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-xl"><i className="fas fa-chevron-right"></i></button>
          </div>

          {monthlyEntries.length === 0 ? (
            <div className="text-center py-16 bg-white rounded-3xl border border-gray-100 shadow-sm">
              <i className="fas fa-calendar-times text-4xl mb-4 text-gray-200"></i>
              <p className="text-sm text-gray-400 font-medium">この月の記録はありません</p>
            </div>
          ) : (
            <>
              {stats.topPeople.length > 0 && (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                  <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-users text-orange-500 mr-2"></i>遊んだ人</h3>
                  <div className="flex flex-wrap gap-2">
                     {stats.topPeople.map(([name, count]) => {
                       const xUser = peopleProfiles[name]?.xUsername;
                       return (
                         <button key={name} onClick={() => onOpenProfile({type: 'person', name})} className="px-3 py-1.5 bg-orange-50 text-orange-700 text-xs font-bold rounded-xl border border-orange-100 active:scale-95 shadow-sm flex items-center">
                           {xUser ? <img src={`https://unavatar.io/twitter/${xUser}`} className="w-3.5 h-3.5 rounded-full mr-1.5 object-cover border border-orange-200" loading="lazy" onError={(e)=>{e.target.style.display='none'}} /> : null}
                           {name} <span className="opacity-50 ml-1.5 font-medium">{count}回</span>
                         </button>
                       );
                     })}
                  </div>
                </div>
              )}

              {stats.topPlaces.length > 0 && (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                  <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-map-marker-alt text-green-500 mr-2"></i>行ったお店</h3>
                  <div className="flex flex-wrap gap-2">
                     {stats.topPlaces.map(([name, count]) => (
                       <button key={name} onClick={() => onOpenProfile({type: 'place', name})} className="px-3 py-1.5 bg-green-50 text-green-700 text-xs font-bold rounded-xl border border-green-100 active:scale-95 shadow-sm flex items-center">
                         {name} <span className="opacity-50 ml-1.5 font-medium">{count}回</span>
                       </button>
                     ))}
                  </div>
                </div>
              )}

              {stats.images.length > 0 && (
                <div>
                  <h3 className="text-gray-500 text-xs font-bold mb-3 ml-1 uppercase tracking-wider"><i className="fas fa-image mr-2"></i>今月の写真</h3>
                  <div className="grid grid-cols-3 gap-2">
                    {stats.images.map((img, i) => (
                      <div key={i} className="aspect-square w-full rounded-2xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50">
                        <img src={formatImageUrl(img)} className="w-full h-full object-cover" />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function AllTimeInsights({ entries, onOpenProfile, peopleProfiles, todayStr }) {
      const { topPlaces, allPeople } = useMemo(() => {
        const placeMap = {};
        const peopleMap = {};

        entries.forEach(e => {
          splitTags(e.where).forEach(p => placeMap[p] = (placeMap[p] || 0) + 1);
          splitTags(e.withWhom).forEach(p => {
            if (!peopleMap[p]) {
              peopleMap[p] = { count: 0, dates: [] };
            }
            peopleMap[p].count += 1;
            if (e.when) peopleMap[p].dates.push(e.when);
          });
        });

        const sortedPlaces = Object.entries(placeMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const sortedPeople = Object.entries(peopleMap).map(([name, data]) => ({
          name,
          count: data.count,
          dates: data.dates
        })).sort((a, b) => b.count - a.count);

        return {
          topPlaces: sortedPlaces,
          allPeople: sortedPeople,
        };
      }, [entries]);

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-map-marker-alt text-green-500 mr-2"></i> よく行くお店 TOP 3</h3>
            {topPlaces.length > 0 ? (
              <ul className="space-y-3">
                {topPlaces.map((item, index) => (
                  <li key={item[0]} onClick={() => onOpenProfile({type: 'place', name: item[0]})} className="flex justify-between items-center bg-gray-50 hover:bg-gray-100 active:scale-95 transition-transform p-3 rounded-2xl cursor-pointer">
                    <div className="flex items-center">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${index === 0 ? 'bg-yellow-100 text-yellow-700' : index === 1 ? 'bg-gray-200 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>
                        {index + 1}
                      </span>
                      <span className="font-bold text-gray-700">{item[0]}</span>
                    </div>
                    <span className="text-gray-500 text-sm font-bold">{item[1]}回</span>
                  </li>
                ))}
              </ul>
            ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-users text-blue-500 mr-2"></i> よく会う人 ランキング</h3>
            {allPeople.length > 0 ? (
              <ul className="space-y-3">
                {allPeople.map((item, index) => {
                  const { name, count, dates } = item;
                  const xUser = peopleProfiles[name]?.xUsername;
                  
                  let badgeClass = "bg-gray-100 text-gray-500";
                  if (index === 0) badgeClass = "bg-yellow-100 text-yellow-700";
                  else if (index === 1) badgeClass = "bg-gray-200 text-gray-600";
                  else if (index === 2) badgeClass = "bg-orange-100 text-orange-700";

                  let scoreDisplay = null;
                  if (dates.length >= 2 && todayStr) {
                    const todayDate = new Date(todayStr);
                    const lastDate = new Date(dates[0]); 
                    const prevLastDate = new Date(dates[1]); 
                    
                    const msToDays = ms => Math.floor(ms / (1000 * 60 * 60 * 24));
                    const daysSinceLast = msToDays(todayDate - lastDate); 
                    const daysBetween = msToDays(lastDate - prevLastDate); 
                    
                    const score = daysBetween - daysSinceLast;
                    
                    const scoreColor = score < 0 ? 'text-red-500 bg-red-50 border-red-100' : 'text-blue-500 bg-blue-50 border-blue-100';
                    const sign = score > 0 ? '+' : '';
                    
                    scoreDisplay = (
                      <div className="flex flex-col items-end mr-3" title={`前回から${daysSinceLast}日経過 (本来のペースより${Math.abs(score)}日${score < 0 ? '遅れ' : '早い'})`}>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${scoreColor}`}>
                          <i className="fas fa-stopwatch mr-1 opacity-70"></i>{sign}{score}
                        </span>
                      </div>
                    );
                  }

                  return (
                    <li key={name} onClick={() => onOpenProfile({type: 'person', name: name})} className="flex justify-between items-center bg-gray-50 hover:bg-gray-100 active:scale-95 transition-transform p-3 rounded-2xl cursor-pointer">
                      <div className="flex items-center shrink min-w-0">
                        <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${badgeClass}`}>
                          {index + 1}
                        </span>
                        {xUser ? <img src={`https://unavatar.io/twitter/${xUser}`} className="shrink-0 w-6 h-6 rounded-full mr-2 object-cover border border-orange-200" loading="lazy" onError={(e)=>{e.target.style.display='none'}} /> : null}
                        <span className="font-bold text-gray-700 truncate">{name}</span>
                      </div>
                      <div className="flex items-center shrink-0 ml-2">
                        {scoreDisplay}
                        <span className="text-gray-500 text-sm font-bold min-w-[2.5rem] text-right">{count}回</span>
                      </div>
                    </li>
                  )
                })}
              </ul>
            ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
          </div>
        </div>
      );
    }

    // ★ホワイトアウト防止: 完全に復元したAIインサイト生成コンポーネント
    function AiInsights({ entries }) {
      const [insight, setInsight] = useState(null);
      const [loading, setLoading] = useState(false);

      const generateInsight = async () => {
        setLoading(true);
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ type: 'ai_analyze' }),
          });
          const data = await response.json();
          if (data.status === 'success') {
            setInsight(data.text);
          } else {
            alert('エラーが発生しました: ' + data.message);
          }
        } catch(e) {
          alert('通信エラーが発生しました');
        }
        setLoading(false);
      };

      return (
        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 animate-fade-in">
          <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-sparkles text-purple-500 mr-2"></i> パーソナルAI分析</h3>
          
          {!insight && !loading && (
            <div className="text-center py-8">
              <div className="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i className="fas fa-brain text-2xl text-purple-500"></i>
              </div>
              <p className="text-sm text-gray-500 mb-6 px-2 font-medium">あなたの日記データをAIが読み込み、<br/>行動の傾向や交友関係のリマインド、<br/>これからの過ごし方を提案します。</p>
              <button onClick={generateInsight} className="bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3 px-6 rounded-2xl shadow-md hover:opacity-90 active:scale-95 transition-all">
                分析を開始する
              </button>
            </div>
          )}
          
          {loading && (
            <div className="text-center py-12">
              <i className="fas fa-spinner fa-spin text-4xl text-purple-500 mb-4"></i>
              <p className="text-sm text-gray-500 font-bold animate-pulse">過去の思い出を読み込み中...</p>
            </div>
          )}
          
          {insight && !loading && (
            <div>
              <div className="text-[14px] text-gray-700 leading-relaxed space-y-2 markdown-body" dangerouslySetInnerHTML={parseMarkdown(insight)} />
              <button onClick={generateInsight} className="mt-8 w-full text-center text-sm font-bold text-purple-600 bg-purple-50 hover:bg-purple-100 py-3 rounded-xl transition-colors active:scale-95">
                <i className="fas fa-redo-alt mr-2"></i>もう一度分析する
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // モーダル (Wiki機能を実装・人WikiはPeopleシート連携)
    // ==========================================
    function ProfileModal({ profile, entries, onClose, onOpenProfile, onSelectDate, peopleProfiles, updatePersonProfile, topicsWiki, updateTopicWiki }) {
      if (!profile) return null;
      const { type, name } = profile;
      
      const isPerson = type === 'person';
      const isTopic = type === 'topic';
      
      const personProfile = isPerson ? (peopleProfiles[name] || {}) : null;
      const xUsername = personProfile?.xUsername;
      
      // 人のメモはpeopleProfilesから、トピックのメモはtopicsWikiからスマートに分離
      const wikiMemo = isPerson ? (peopleProfiles[name]?.memo || '') : (topicsWiki[name]?.memo || '');
      const [wikiText, setWikiText] = useState(wikiMemo);
      const [isSavingWiki, setIsSavingWiki] = useState(false);
      
      const [editX, setEditX] = useState(false);
      const [xInput, setXInput] = useState(xUsername || '');
      const [isSavingX, setIsSavingX] = useState(false);

      useEffect(() => {
        setXInput(xUsername || '');
      }, [xUsername]);

      useEffect(() => {
        setWikiText(wikiMemo);
      }, [wikiMemo]);

      const handleSaveX = async () => {
        setIsSavingX(true);
        const username = extractXUsername(xInput);
        await updatePersonProfile(name, { xUsername: username || null });
        setIsSavingX(false);
        setEditX(false);
      };

      const handleSaveWiki = async () => {
        setIsSavingWiki(true);
        if (isPerson) {
          // PeopleシートのC列「前提メモ」を直接書き換えるように同期
          await updatePersonProfile(name, { memo: wikiText });
        } else {
          await updateTopicWiki(name, wikiText); 
        }
        setIsSavingWiki(false);
      };
      
      const colorClass = isPerson ? 'from-orange-400 to-orange-500' : isTopic ? 'from-purple-400 to-purple-500' : 'from-green-400 to-green-500';
      const textClass = isPerson ? 'text-orange-600' : isTopic ? 'text-purple-600' : 'text-green-600';
      const icon = isPerson ? 'fa-user' : isTopic ? 'fa-layer-group' : 'fa-map-marker-alt';
      const labelText = isPerson ? 'Profile' : isTopic ? 'Topic' : 'Location';

      const relatedEntries = useMemo(() => {
        return entries.filter(e => {
          if (type === 'person') return splitTags(e.withWhom).includes(name);
          if (type === 'place') return splitTags(e.where).includes(name);
          if (type === 'topic') return e.topic1 === name || e.topic2 === name;
          return false;
        }).sort((a, b) => new Date(b.when) - new Date(a.when));
      }, [entries, type, name]);

      const stats = useMemo(() => {
        if (relatedEntries.length === 0) return null;
        const firstDate = relatedEntries[relatedEntries.length - 1].when;
        const daysCount = relatedEntries.length;
        
        const relatedMap = {};
        
        relatedEntries.forEach(e => {
          const tags = type === 'person' ? splitTags(e.where) : type === 'place' ? splitTags(e.withWhom) : [...splitTags(e.where), ...splitTags(e.withWhom)];
          tags.forEach(t => {
            relatedMap[t] = (relatedMap[t] || 0) + 1;
          });
        });
        
        const topRelated = Object.entries(relatedMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
        
        return { firstDate, daysCount, topRelated };
      }, [relatedEntries, type]);

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center animate-fade-in" onClick={onClose}>
          <div 
            className="bg-gray-50 w-full h-[100dvh] max-w-lg sm:h-[90vh] sm:rounded-2xl overflow-hidden flex flex-col shadow-2xl animate-slide-up"
            onClick={(e) => e.stopPropagation()}
          >
            <div className={`p-6 pb-5 bg-gradient-to-br ${colorClass} text-white relative`}>
              <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 bg-black/20 hover:bg-black/30 rounded-full flex items-center justify-center transition-colors">
                <i className="fas fa-times"></i>
              </button>
              <div className="flex items-start gap-4 mt-2">
                <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl backdrop-blur-sm border border-white/30 shadow-inner overflow-hidden flex-shrink-0">
                  {isPerson && xUsername ? (
                    <img src={`https://unavatar.io/twitter/${xUsername}`} className="w-full h-full object-cover" />
                  ) : (
                    <i className={`fas ${icon}`}></i>
                  )}
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs opacity-90 font-medium mb-0.5 tracking-wider uppercase">{labelText}</p>
                  <h2 className="text-2xl font-bold leading-tight break-words">{name}</h2>
                  
                  {isPerson && (
                    <div className="mt-2">
                      {editX ? (
                        <div className="flex gap-1 items-center bg-white/10 p-1 rounded-lg backdrop-blur-md">
                          <input type="text" value={xInput} onChange={e=>setXInput(e.target.value)} placeholder="XのURL or @ID" className="text-gray-800 text-xs p-1.5 rounded-md flex-1 outline-none border-none" disabled={isSavingX}/>
                          <button onClick={handleSaveX} disabled={isSavingX} className={`bg-white text-orange-500 px-3 py-1.5 rounded-md text-xs font-bold active:scale-95 ${isSavingX ? 'opacity-50' : ''}`}>{isSavingX ? '保存中...' : '保存'}</button>
                        </div>
                      ) : (
                        xUsername ? (
                          <div className="inline-flex items-center gap-1.5 text-xs bg-white/20 hover:bg-white/30 px-2 py-1 rounded-lg cursor-pointer backdrop-blur-sm transition-colors border border-white/20" onClick={()=>setEditX(true)}>
                            <i className="fab fa-twitter"></i> @{xUsername} <i className="fas fa-pen ml-1 text-[10px] opacity-70"></i>
                          </div>
                        ) : (
                          <button onClick={()=>setEditX(true)} className="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full backdrop-blur-sm transition-colors border border-white/20">
                            <i className="fab fa-twitter mr-1"></i> Xアカウントを紐付け
                          </button>
                        )
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto overflow-x-hidden w-full p-5 space-y-6 pb-10">
              
              {/* Wiki(前提メモ) エリア */}
              {(isTopic || isPerson) && (
                <div className={`${isPerson ? 'bg-orange-50 border-orange-100' : 'bg-purple-50 border-purple-100'} p-4 rounded-3xl shadow-sm border`}>
                  <h3 className={`text-xs font-bold ${isPerson ? 'text-orange-600' : 'text-purple-600'} mb-2 uppercase tracking-wider flex justify-between items-center`}>
                    <span><i className="fas fa-book-open mr-2"></i>前提メモ (Wiki)</span>
                    {wikiMemo !== wikiText && (
                      <button onClick={handleSaveWiki} disabled={isSavingWiki} className={`${isPerson ? 'bg-orange-600 hover:bg-orange-700' : 'bg-purple-600 hover:bg-purple-700'} text-white px-3 py-1 rounded-lg text-xs active:scale-95 transition-all`}>
                        {isSavingWiki ? '保存中...' : '保存'}
                      </button>
                    )}
                  </h3>
                  <textarea 
                    value={wikiText} 
                    onChange={e => setWikiText(e.target.value)} 
                    placeholder={isPerson ? "この人の前提情報や関係性などを自由にメモできます。ここに書いた内容はAIチャットの「前提知識」として読み込まれます。" : "このコミュニティやテーマの前提情報、関わり方、メンバー情報などを自由にメモできます。ここに書いた内容はAIチャットの「前提知識」として読み込まれます。"}
                    className={`w-full bg-white/50 p-3 rounded-2xl text-[13px] text-gray-700 border ${isPerson ? 'border-orange-200/50 focus:ring-orange-400' : 'border-purple-200/50 focus:ring-purple-400'} outline-none focus:ring-2 focus:bg-white resize-none`}
                    rows="4"
                  />
                </div>
              )}

              {stats ? (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                      <p className="text-[10px] text-gray-400 font-bold mb-1">思い出の日数</p>
                      <p className={`text-3xl font-bold ${textClass}`}>{stats.daysCount} <span className="text-sm text-gray-400 font-medium ml-1">日</span></p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center flex flex-col justify-center">
                      <p className="text-[10px] text-gray-400 font-bold mb-1">はじめての記録</p>
                      <p className="text-lg font-bold text-gray-700">{stats.firstDate.replace(/-/g, '/')}</p>
                    </div>
                  </div>

                  {stats.topRelated.length > 0 && (
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                      <h3 className="text-xs font-bold text-gray-500 mb-3 uppercase tracking-wider">
                        <i className={`fas ${isPerson ? 'fa-map-marker-alt' : isTopic ? 'fa-link' : 'fa-users'} mr-2`}></i>
                        よく一緒に{isPerson ? '行くお店' : isTopic ? '関連する人/場所' : 'いる人'}
                      </h3>
                      <div className="flex flex-wrap gap-2">
                        {stats.topRelated.map(([relName, count], idx) => (
                          <button 
                            key={idx} 
                            onClick={() => onOpenProfile({ type: isPerson ? 'place' : 'person', name: relName })}
                            className={`px-3 py-1.5 bg-gray-50 hover:bg-gray-100 text-gray-700 text-xs font-bold rounded-xl border border-gray-200 flex items-center gap-1 active:scale-95 transition-transform`}
                          >
                            <span>{relName}</span>
                            <span className="opacity-40 font-normal ml-1">{count}回</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div>
                    <h3 className="text-xs font-bold text-gray-500 mb-3 ml-1 uppercase tracking-wider"><i className="fas fa-history mr-2"></i>History</h3>
                    <div className="space-y-4">
                      {relatedEntries.map((entry, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                          <div className="flex justify-between items-center mb-2">
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-bold text-blue-600">{entry.when.replace(/-/g, '/')} <span className="text-xs">({getDayOfWeek(entry.when)})</span></span>
                              <button onClick={() => { onSelectDate(entry.when); onClose(); }} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-md hover:bg-blue-100 transition-colors active:scale-95"><i className="fas fa-pen mr-1"></i>編集</button>
                            </div>
                          </div>

                          <EntryCardContent entry={entry} isPerson={isPerson} isTopic={isTopic} name={name} onOpenProfile={onOpenProfile} peopleProfiles={peopleProfiles} />
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              ) : (
                <div className="text-center py-12 text-gray-400">データがありません</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
