    function MonthCalendar({ year, month, todayStr, entryDatesMap, onDayClick }) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const days = Array(firstDay).fill(null).concat(Array.from({length: daysInMonth}, (_, i) => i + 1));

      return (
        <div className="flex flex-col">
          <h2 className="text-lg font-bold mb-2 ml-1 text-gray-800">{month + 1}月</h2>
          <div className="grid grid-cols-7 gap-y-1 text-center">
            {['日','月','火','水','木','金','土'].map((d, i) => <div key={d} className={`text-[8px] font-medium mb-1 ${i === 0 ? 'text-red-400' : 'text-gray-400'}`}>{d}</div>)}
            {days.map((day, index) => {
              if (!day) return <div key={`empty-${index}`} />;
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const isToday = dateStr === todayStr;
              const hasEntry = !!entryDatesMap[dateStr];

              return (
                <button key={dateStr} id={isToday ? 'today-calendar-btn' : undefined} onClick={() => onDayClick(dateStr)} className="relative flex flex-col items-center justify-center w-full aspect-square text-xs font-medium active:scale-90 transition-transform">
                  <span className={`flex items-center justify-center w-6 h-6 rounded-full ${isToday ? 'bg-red-500 text-white font-bold shadow-sm' : 'text-gray-800'}`}>{day}</span>
                  {hasEntry && !isToday && (
                    <div className="absolute bottom-0.5 pointer-events-none">
                      <div className="w-1 h-1 bg-gray-400 rounded-full mx-auto"></div>
                    </div>
                  )}
                  {hasEntry && isToday && (
                    <div className="absolute bottom-0.5 pointer-events-none">
                      <div className="w-1 h-1 bg-white rounded-full mx-auto"></div>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 検索タブ
    // ==========================================
    function SearchTab({ entries, onOpenProfile, onSelectDate, peopleProfiles, query, setQuery, filterTag, setFilterTag }) {
      const popularPeople = useMemo(() => {
        const map = {};
        entries.forEach(e => splitTags(e.withWhom).forEach(p => map[p] = (map[p] || 0) + 1));
        return Object.keys(map).sort((a, b) => a.localeCompare(b, 'ja'));
      }, [entries]);

      const popularPlaces = useMemo(() => {
        const map = {};
        entries.forEach(e => splitTags(e.where).forEach(p => map[p] = (map[p] || 0) + 1));
        return Object.keys(map).sort((a, b) => a.localeCompare(b, 'ja'));
      }, [entries]);

      const filteredEntries = useMemo(() => {
        if (filterTag) {
          return entries.filter(e => {
            if (filterTag.type === 'person') return splitTags(e.withWhom).includes(filterTag.value);
            if (filterTag.type === 'place') return splitTags(e.where).includes(filterTag.value);
            return false;
          }).sort((a, b) => new Date(b.when) - new Date(a.when));
        }

        if (!query.trim()) return [];
        const lower = query.toLowerCase();
        return entries.filter(e => 
          (e.what || '').toLowerCase().includes(lower) || 
          (e.where || '').toLowerCase().includes(lower) || 
          (e.withWhom || '').toLowerCase().includes(lower)
        ).sort((a, b) => new Date(b.when) - new Date(a.when));
      }, [query, filterTag, entries]);

      return (
        <div className="p-4 max-w-lg mx-auto w-full animate-fade-in overflow-x-hidden">
          <div className="sticky top-0 bg-white/95 backdrop-blur-sm z-10 pt-4 pb-4 border-b border-gray-100">
            <div className="relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-search text-gray-400"></i></div>
              <input type="text" className="block w-full pl-10 pr-10 py-3 border border-gray-200 rounded-2xl bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="内容、人、お店で検索..." value={query} onChange={(e) => { setQuery(e.target.value); setFilterTag(null); }} />
              {query && <button onClick={() => setQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>}
            </div>

            {filterTag && (
              <div className="mt-3 flex items-center gap-2 animate-fade-in">
                <span className="text-xs font-bold text-gray-500">絞り込み中:</span>
                <div className={`px-3 py-1.5 text-sm font-bold rounded-xl flex items-center shadow-sm ${filterTag.type === 'person' ? 'bg-orange-50 text-orange-700 border border-orange-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                  <i className={`fas ${filterTag.type === 'person' ? 'fa-user' : 'fa-map-marker-alt'} text-xs mr-2 opacity-50`}></i>
                  {filterTag.value}
                  <button onClick={() => setFilterTag(null)} className="ml-2 w-5 h-5 flex items-center justify-center rounded-full bg-black/5 hover:bg-black/10 transition-colors"><i className="fas fa-times text-[10px]"></i></button>
                </div>
              </div>
            )}
          </div>

          <div className="mt-4">
            {!query.trim() && !filterTag && (popularPeople.length > 0 || popularPlaces.length > 0) && (
              <div className="mb-8 space-y-6">
                
                {popularPeople.length > 0 && (
                  <div>
                    <h3 className="text-sm font-bold text-gray-500 mb-3 flex items-center"><i className="fas fa-users mr-1"></i> 人で絞り込む</h3>
                    <div className="flex flex-wrap gap-2">
                      {popularPeople.map((person, idx) => {
                        const xUser = peopleProfiles[person]?.xUsername;
                        return (
                          <button key={idx} onClick={() => { setFilterTag({ type: 'person', value: person }); setQuery(''); }} className="flex items-center px-3 py-1.5 bg-orange-50 text-orange-700 text-sm font-bold rounded-xl border border-orange-100 active:scale-95 shadow-sm">
                            {xUser ? (
                              <img src={`https://unavatar.io/twitter/${xUser}`} className="w-4 h-4 rounded-full mr-1.5 object-cover border border-orange-200" loading="lazy" onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='inline-block';}} />
                            ) : null}
                            <i className="fas fa-user text-xs mr-1.5 opacity-50" style={{ display: xUser ? 'none' : 'inline-block' }}></i> 
                            {person}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {popularPlaces.length > 0 && (
                  <div>
                    <h3 className="text-sm font-bold text-gray-500 mb-3 flex items-center"><i className="fas fa-map-marker-alt mr-1"></i> お店で絞り込む</h3>
                    <div className="flex flex-wrap gap-2">
                      {popularPlaces.map((place, idx) => (
                        <button key={idx} onClick={() => { setFilterTag({ type: 'place', value: place }); setQuery(''); }} className="px-3 py-1.5 bg-green-50 text-green-700 text-sm font-bold rounded-xl border border-green-100 active:scale-95 shadow-sm">
                          <i className="fas fa-map-marker-alt text-xs mr-1 opacity-50"></i> {place}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {!query.trim() && !filterTag ? (
              popularPeople.length === 0 && popularPlaces.length === 0 && <div className="text-center py-12 text-gray-400"><i className="fas fa-search text-4xl mb-4 opacity-20"></i><p className="text-sm">思い出を検索してみましょう</p></div>
            ) : filteredEntries.length === 0 ? (
              <div className="text-center py-12 text-gray-500">一致する日記は見つかりませんでした。</div>
            ) : (
              <div className="space-y-6">
                <p className="text-sm text-gray-500 mb-2">{filteredEntries.length}件見つかりました</p>
                {filteredEntries.map((entry, idx) => {
                  const tweetUrls = extractTweetUrls(entry.what);

                  return (
                    <div key={idx} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                      <div className="text-sm font-bold text-blue-600 mb-3 flex justify-between border-b border-gray-50 pb-2">
                        <div className="flex items-center gap-2">
                          <span>{entry.when && entry.when.replace(/-/g, '/')} <span className="text-xs">({getDayOfWeek(entry.when)})</span></span>
                          <button onClick={() => onSelectDate(entry.when)} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-md hover:bg-blue-100 transition-colors active:scale-95"><i className="fas fa-pen mr-1"></i>編集</button>
                        </div>
                      </div>

                      {entry.images && entry.images.length > 0 && (
                        <div className="w-full aspect-square grid grid-cols-2 grid-rows-2 gap-1 bg-white p-1 rounded-2xl border border-gray-100 mb-4">
                          {entry.images.map((img, i) => (
                            <div key={`search-img-${i}`} className="w-full h-full bg-gray-50 rounded-xl overflow-hidden shadow-sm">
                              <img src={formatImageUrl(img)} className="w-full h-full object-cover" />
                            </div>
                          ))}
                        </div>
                      )}

                      <p className="text-gray-800 whitespace-pre-wrap break-words text-[15px] leading-relaxed mb-4">{entry.what}</p>
                      
                      {tweetUrls.length > 0 && (
                        <div className="flex flex-col gap-2 mb-4">
                          {tweetUrls.map((url, i) => <TweetEmbed key={`search-${url}-${i}`} url={url} />)}
                        </div>
                      )}

                      <TagList places={splitTags(entry.where)} people={splitTags(entry.withWhom)} onOpenProfile={onOpenProfile} peopleProfiles={peopleProfiles} />
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // インサイト（振り返り）タブ
    // ==========================================
    function InsightsTab({ entries, onOpenProfile, peopleProfiles, resetKey, todayStr }) {
      const [viewMode, setViewMode] = useState('monthly'); // 'monthly' | 'all'
      const [randomJumpKey, setRandomJumpKey] = useState(0);
      
      // ヘッダー部等でのスワイプでモードを切り替え
      const { onTouchStart, onTouchEnd } = useSwipe(
        () => setViewMode('all'),
        () => setViewMode('monthly')
      );

      // 2タップ目リセット用
      useEffect(() => {
        if (resetKey > 0) {
          setViewMode('monthly');
          setRandomJumpKey(k => k + 1);
        }
      }, [resetKey]);

      return (
        <div className="p-4 max-w-lg mx-auto w-full animate-fade-in overflow-x-hidden bg-gray-50 min-h-screen">
          <div 
            className="pt-4 pb-4 sticky top-0 bg-gray-50/95 backdrop-blur-sm z-10"
            onTouchStart={onTouchStart} 
            onTouchEnd={onTouchEnd}
          >
            <div className="flex bg-gray-200 p-1 rounded-xl">
              <button 
                onClick={() => setViewMode('monthly')} 
                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${viewMode === 'monthly' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
              >
                月間ハイライト
              </button>
              <button 
                onClick={() => setViewMode('all')} 
                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${viewMode === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
              >
                全期間
              </button>
            </div>
          </div>

          <div className="mt-4">
            {viewMode === 'monthly' ? (
              <MonthlyInsights entries={entries} onOpenProfile={onOpenProfile} peopleProfiles={peopleProfiles} randomJumpKey={randomJumpKey} />
            ) : (
              <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
                <AllTimeInsights entries={entries} onOpenProfile={onOpenProfile} peopleProfiles={peopleProfiles} todayStr={todayStr} />
              </div>
            )}
          </div>
        </div>
      );
    }

    function MonthlyInsights({ entries, onOpenProfile, peopleProfiles, randomJumpKey }) {
      const [targetDate, setTargetDate] = useState(new Date());

      const year = targetDate.getFullYear();
      const month = targetDate.getMonth() + 1;
      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

      const monthlyEntries = useMemo(() => entries.filter(e => e.when && e.when.startsWith(monthPrefix)), [entries, monthPrefix]);

      const handlePrevMonth = () => {
        const d = new Date(targetDate);
        d.setMonth(d.getMonth() - 1);
        setTargetDate(d);
      };
      const handleNextMonth = () => {
        const d = new Date(targetDate);
        d.setMonth(d.getMonth() + 1);
        setTargetDate(d);
      };

      // ランダム月ジャンプ用
      useEffect(() => {
        if (randomJumpKey > 0) {
          const monthsWithEntries = [...new Set(entries.filter(e => e.when).map(e => e.when.substring(0, 7)))];
          if (monthsWithEntries.length > 0) {
            const randomMonthStr = monthsWithEntries[Math.floor(Math.random() * monthsWithEntries.length)];
            const [y, m] = randomMonthStr.split('-');
            setTargetDate(new Date(parseInt(y), parseInt(m) - 1, 1));
          } else {
            const d = new Date();
            d.setMonth(d.getMonth() - Math.floor(Math.random() * 24));
            setTargetDate(d);
          }
        }
      }, [randomJumpKey, entries]);

      // 月間ハイライト内の左右スワイプによる月移動
      const { onTouchStart, onTouchEnd } = useSwipe(handleNextMonth, handlePrevMonth);

      const stats = useMemo(() => {
        const placeMap = {};
        const peopleMap = {};
        const monthImages = [];

        monthlyEntries.forEach(e => {
          splitTags(e.where).forEach(p => placeMap[p] = (placeMap[p] || 0) + 1);
          splitTags(e.withWhom).forEach(p => peopleMap[p] = (peopleMap[p] || 0) + 1);
          if (e.images) monthImages.push(...e.images);
        });

        const sortMap = (map) => Object.entries(map).sort((a, b) => b[1] - a[1]);

        return {
          totalDays: monthlyEntries.length,
          topPlaces: sortMap(placeMap),
          topPeople: sortMap(peopleMap),
          images: monthImages
        };
      }, [monthlyEntries]);

      return (
        <div 
          className="space-y-6 animate-fade-in"
          onTouchStart={(e) => { e.stopPropagation(); onTouchStart(e); }}
          onTouchEnd={(e) => { e.stopPropagation(); onTouchEnd(e); }}
        >
          <div className="flex items-center justify-between bg-white rounded-2xl p-2 shadow-sm border border-gray-100">
            <button onClick={handlePrevMonth} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-xl"><i className="fas fa-chevron-left"></i></button>
            <span className="font-bold text-lg text-gray-800">{year}年 {month}月</span>
            <button onClick={handleNextMonth} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-xl"><i className="fas fa-chevron-right"></i></button>
          </div>

          {monthlyEntries.length === 0 ? (
            <div className="text-center py-16 bg-white rounded-3xl border border-gray-100 shadow-sm">
              <i className="fas fa-calendar-times text-4xl mb-4 text-gray-200"></i>
              <p className="text-sm text-gray-400 font-medium">この月の記録はありません</p>
            </div>
          ) : (
            <>
              {stats.topPeople.length > 0 && (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                  <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-users text-orange-500 mr-2"></i>遊んだ人</h3>
                  <div className="flex flex-wrap gap-2">
                     {stats.topPeople.map(([name, count]) => {
                       const xUser = peopleProfiles[name]?.xUsername;
                       return (
                         <button key={name} onClick={() => onOpenProfile({type: 'person', name})} className="px-3 py-1.5 bg-orange-50 text-orange-700 text-xs font-bold rounded-xl border border-orange-100 active:scale-95 shadow-sm flex items-center">
                           {xUser ? <img src={`https://unavatar.io/twitter/${xUser}`} className="w-3.5 h-3.5 rounded-full mr-1.5 object-cover border border-orange-200" loading="lazy" onError={(e)=>{e.target.style.display='none'}} /> : null}
                           {name} <span className="opacity-50 ml-1.5 font-medium">{count}回</span>
                         </button>
                       );
                     })}
                  </div>
                </div>
              )}

              {stats.topPlaces.length > 0 && (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                  <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-map-marker-alt text-green-500 mr-2"></i>行ったお店</h3>
                  <div className="flex flex-wrap gap-2">
                     {stats.topPlaces.map(([name, count]) => (
                       <button key={name} onClick={() => onOpenProfile({type: 'place', name})} className="px-3 py-1.5 bg-green-50 text-green-700 text-xs font-bold rounded-xl border border-green-100 active:scale-95 shadow-sm flex items-center">
                         {name} <span className="opacity-50 ml-1.5 font-medium">{count}回</span>
                       </button>
                     ))}
                  </div>
                </div>
              )}

              {stats.images.length > 0 && (
                <div>
                  <h3 className="text-gray-500 text-xs font-bold mb-3 ml-1 uppercase tracking-wider"><i className="fas fa-image mr-2"></i>今月の写真</h3>
                  <div className="grid grid-cols-3 gap-2">
                    {stats.images.map((img, i) => (
                      <div key={i} className="aspect-square w-full rounded-2xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50">
                        <img src={formatImageUrl(img)} className="w-full h-full object-cover" />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function AllTimeInsights({ entries, onOpenProfile, peopleProfiles, todayStr }) {
      const { topPlaces, allPeople } = useMemo(() => {
        const placeMap = {};
        const peopleMap = {};

        entries.forEach(e => {
          splitTags(e.where).forEach(p => placeMap[p] = (placeMap[p] || 0) + 1);
          splitTags(e.withWhom).forEach(p => {
            if (!peopleMap[p]) {
              peopleMap[p] = { count: 0, dates: [] };
            }
            peopleMap[p].count += 1;
            if (e.when) peopleMap[p].dates.push(e.when);
          });
        });

        const sortedPlaces = Object.entries(placeMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const sortedPeople = Object.entries(peopleMap).map(([name, data]) => ({
          name,
          count: data.count,
          dates: data.dates
        })).sort((a, b) => b.count - a.count);

        return {
          topPlaces: sortedPlaces,
          allPeople: sortedPeople,
        };
      }, [entries]);

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-map-marker-alt text-green-500 mr-2"></i> よく行くお店 TOP 3</h3>
            {topPlaces.length > 0 ? (
              <ul className="space-y-3">
                {topPlaces.map((item, index) => (
                  <li key={item[0]} onClick={() => onOpenProfile({type: 'place', name: item[0]})} className="flex justify-between items-center bg-gray-50 hover:bg-gray-100 active:scale-95 transition-transform p-3 rounded-2xl cursor-pointer">
                    <div className="flex items-center">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${index === 0 ? 'bg-yellow-100 text-yellow-700' : index === 1 ? 'bg-gray-200 text-gray-600' : 'bg-orange-100 text-orange-700'}`}>
                        {index + 1}
                      </span>
                      <span className="font-bold text-gray-700">{item[0]}</span>
                    </div>
                    <span className="text-gray-500 text-sm font-bold">{item[1]}回</span>
                  </li>
                ))}
              </ul>
            ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <h3 className="text-gray-800 font-bold mb-4 flex items-center"><i className="fas fa-users text-blue-500 mr-2"></i> よく会う人 ランキング</h3>
            {allPeople.length > 0 ? (
              <ul className="space-y-3">
                {allPeople.map((item, index) => {
                  const { name, count, dates } = item;
                  const xUser = peopleProfiles[name]?.xUsername;
                  
                  let badgeClass = "bg-gray-100 text-gray-500";
                  if (index === 0) badgeClass = "bg-yellow-100 text-yellow-700";
                  else if (index === 1) badgeClass = "bg-gray-200 text-gray-600";
                  else if (index === 2) badgeClass = "bg-orange-100 text-orange-700";

                  // 会う時期の目安スコアを計算 (2回以上会っている場合のみ)
                  let scoreDisplay = null;
                  if (dates.length >= 2 && todayStr) {
                    const todayDate = new Date(todayStr);
                    const lastDate = new Date(dates[0]); // 前回
                    const prevLastDate = new Date(dates[1]); // 前々回
                    
                    const msToDays = ms => Math.floor(ms / (1000 * 60 * 60 * 24));
                    const daysSinceLast = msToDays(todayDate - lastDate); // 前回〜今日
                    const daysBetween = msToDays(lastDate - prevLastDate); // 前々回〜前回
                    
                    const score = daysBetween - daysSinceLast;
                    
                    // マイナス(そろそろ会うべき)なら赤系、プラス(まだ余裕)なら青系
                    const scoreColor = score < 0 ? 'text-red-500 bg-red-50 border-red-100' : 'text-blue-500 bg-blue-50 border-blue-100';
                    const sign = score > 0 ? '+' : '';
                    
                    scoreDisplay = (
                      <div className="flex flex-col items-end mr-3" title={`前回から${daysSinceLast}日経過 (本来のペースより${Math.abs(score)}日${score < 0 ? '遅れ' : '早い'})`}>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${scoreColor}`}>
                          <i className="fas fa-stopwatch mr-1 opacity-70"></i>{sign}{score}
                        </span>
                      </div>
                    );
                  }

                  return (
                    <li key={name} onClick={() => onOpenProfile({type: 'person', name: name})} className="flex justify-between items-center bg-gray-50 hover:bg-gray-100 active:scale-95 transition-transform p-3 rounded-2xl cursor-pointer">
                      <div className="flex items-center shrink min-w-0">
                        <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${badgeClass}`}>
                          {index + 1}
                        </span>
                        {xUser ? <img src={`https://unavatar.io/twitter/${xUser}`} className="shrink-0 w-6 h-6 rounded-full mr-2 object-cover border border-orange-200" loading="lazy" onError={(e)=>{e.target.style.display='none'}} /> : null}
                        <span className="font-bold text-gray-700 truncate">{name}</span>
                      </div>
                      <div className="flex items-center shrink-0 ml-2">
                        {scoreDisplay}
                        <span className="text-gray-500 text-sm font-bold min-w-[2.5rem] text-right">{count}回</span>
                      </div>
                    </li>
                  )
                })}
              </ul>
            ) : <p className="text-gray-400 text-sm text-center py-4">データがありません</p>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
