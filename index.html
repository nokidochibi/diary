<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>複数年日記</title>
  
  <!-- 各種ライブラリの読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    
    /* アニメーション設定 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInFromRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInFromLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideInFromRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .animate-slide-right { animation: slideInFromLeft 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div id="root"></div>

  <!-- 【重要】先にComponents.jsを読み込みます -->
  <script type="text/babel" src="Components.js" data-presets="react"></script>

  <!-- アプリのメインロジック（頭脳部分） -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ★ GASのURL（あなたのURLをここに貼ってください） ★
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx94R3YWE7w_IfmSTqz9_FNlEUNPWNkq4auvvn0BMM7b2z4wwjBtJpT_D_0XgATh9zb/exec"; 

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [searchFilterTag, setSearchFilterTag] = useState(null);
      const [entries, setEntries] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [selectedProfile, setSelectedProfile] = useState(null); 
      const [peopleProfiles, setPeopleProfiles] = useState({});
      
      const mainRef = useRef(null); 
      const [tabClickCount, setTabClickCount] = useState(0);
      const scrollPositions = useRef({ home: 0, calendar: 0, search: 0, insights: 0 });
      const [tabResetKeys, setTabResetKeys] = useState({ calendar: 0, insights: 0 });

      const todayStr = useMemo(() => {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      }, []);
      
      const [viewingDateStr, setViewingDateStr] = useState(todayStr);

      // データ取得
      useEffect(() => {
        const fetchEntries = async () => {
          if (!GAS_WEB_APP_URL) return;
          setIsLoading(true);
          try {
            const response = await fetch(`${GAS_WEB_APP_URL}?t=${new Date().getTime()}`);
            const data = await response.json();
            if (Array.isArray(data)) {
              setEntries(data.filter(e => e.when).sort((a, b) => new Date(b.when) - new Date(a.when)));
            } else {
              setEntries(data.entries.filter(e => e.when).sort((a, b) => new Date(b.when) - new Date(a.when)));
              if (data.profiles) setPeopleProfiles(data.profiles);
            }
          } catch (error) {
            console.error("取得失敗:", error);
          } finally {
            setIsLoading(false);
          }
        };
        fetchEntries();
      }, []);

      // 保存処理
      const saveEntry = useCallback(async (entry) => {
        setEntries(prev => {
          let newEntries = [...prev];
          const existingIndex = newEntries.findIndex(e => e.when === entry.when);
          if (existingIndex >= 0) {
            newEntries[existingIndex] = { ...newEntries[existingIndex], ...entry };
          } else {
            newEntries.unshift({ ...entry, id: Date.now().toString() });
          }
          return newEntries;
        });

        if (GAS_WEB_APP_URL) {
          try {
            await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(entry), 
            });
          } catch (error) {
            console.error("保存失敗:", error);
          }
        }
        return { success: true };
      }, []);

      // プロフィール更新
      const updatePersonProfile = async (name, data) => {
        setPeopleProfiles(prev => ({ ...prev, [name]: { ...(prev[name] || {}), ...data } }));
        if (GAS_WEB_APP_URL) {
          try {
            await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
              body: JSON.stringify({ type: 'profile', name, xUsername: data.xUsername }),
            });
          } catch (e) { console.error(e); }
        }
      };

      // タブクリック時の挙動
      const handleTabClick = (targetTab) => {
        if (activeTab !== targetTab) {
          setActiveTab(targetTab);
        } else {
          if (tabClickCount === 0) {
            if (targetTab === 'home') setViewingDateStr(todayStr);
            else if (targetTab === 'search') { setSearchQuery(''); setSearchFilterTag(null); }
            else if (targetTab === 'calendar' || targetTab === 'insights') {
              setTabResetKeys(prev => ({ ...prev, [targetTab]: prev[targetTab] + 1 }));
            }
            setTabClickCount(1);
          } else {
            mainRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
            setTabClickCount(0);
          }
        }
      };

      return (
        <div className="min-h-screen bg-white flex flex-col relative">
          {isLoading && (
            <div className="absolute inset-0 bg-white/70 backdrop-blur-sm z-50 flex items-center justify-center">
              同期中...
            </div>
          )}

          <main ref={mainRef} className="flex-1 overflow-y-auto overflow-x-hidden pb-20 scroll-smooth">
            {activeTab === 'home' && (
              <window.HomeTab 
                viewingDateStr={viewingDateStr} setViewingDateStr={setViewingDateStr} todayStr={todayStr} 
                entries={entries} onSave={saveEntry} onOpenProfile={setSelectedProfile} peopleProfiles={peopleProfiles}
              />
            )}
            {activeTab === 'calendar' && (
              <window.CalendarTab 
                entries={entries} todayStr={todayStr} onOpenProfile={setSelectedProfile} 
                peopleProfiles={peopleProfiles} resetKey={tabResetKeys.calendar}
                onSelectDate={(date) => { setViewingDateStr(date); setActiveTab('home'); }}
              />
            )}
            {activeTab === 'search' && (
              <window.SearchTab 
                entries={entries} onOpenProfile={setSelectedProfile} peopleProfiles={peopleProfiles}
                query={searchQuery} setQuery={setSearchQuery} filterTag={searchFilterTag} setFilterTag={setSearchFilterTag}
                onSelectDate={(date) => { setViewingDateStr(date); setActiveTab('home'); }}
              />
            )}
            {activeTab === 'insights' && (
              <window.InsightsTab entries={entries} onOpenProfile={setSelectedProfile} peopleProfiles={peopleProfiles} resetKey={tabResetKeys.insights} />
            )}
          </main>

          <nav className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 pb-safe z-40">
            <button onClick={() => handleTabClick('home')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-400'}`}>
              <i className="fas fa-pen-to-square text-xl"></i>
              <span className="text-[10px] font-medium">入力</span>
            </button>
            <button onClick={() => handleTabClick('calendar')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab === 'calendar' ? 'text-blue-600' : 'text-gray-400'}`}>
              <i className="fas fa-calendar text-xl"></i>
              <span className="text-[10px] font-medium">カレンダー</span>
            </button>
            <button onClick={() => handleTabClick('search')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab === 'search' ? 'text-blue-600' : 'text-gray-400'}`}>
              <i className="fas fa-search text-xl"></i>
              <span className="text-[10px] font-medium">検索</span>
            </button>
            <button onClick={() => handleTabClick('insights')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab === 'insights' ? 'text-blue-600' : 'text-gray-400'}`}>
              <i className="fas fa-chart-pie text-xl"></i>
              <span className="text-[10px] font-medium">振り返り</span>
            </button>
          </nav>

          {selectedProfile && (
            <window.ProfileModal 
              profile={selectedProfile} entries={entries} onClose={() => setSelectedProfile(null)} 
              onOpenProfile={setSelectedProfile} peopleProfiles={peopleProfiles} updatePersonProfile={updatePersonProfile}
              onSelectDate={(date) => { setViewingDateStr(date); setActiveTab('home'); }}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
